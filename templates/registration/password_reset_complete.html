{% extends "layout.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #000;">
    <div class="card shadow p-4 text-center" style="width: 100%; max-width: 450px; border-radius: 15px; background: linear-gradient(145deg, #1a1a2e, #16213e); border: 1px solid rgba(0, 255, 213, 0.2);">
        <div class="mb-4">
            <i class="fas fa-check-circle fa-4x" style="color: #00ffd5;"></i>
        </div>
        <h3 class="mb-3" style="color: #00ffd5;">Password Reset Successful!</h3>
        <p class="text-muted mb-4">
            Your password has been successfully reset. You can now log in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-lg" style="background: linear-gradient(135deg, #00ffd5, #00b4db); color: #000; font-weight: 600; border-radius: 10px; border: none; padding: 12px 30px;">
            <i class="fas fa-sign-in-alt me-2"></i>Login Now
        </a>
    </div>
</div>
{% endblock %}
